name: miniArm Python and Windows layout
on:
  push:
    paths:
      - 'lab03_inverse_kinematics/**'
      - '.github/workflows/miniarm-python.yml'
  pull_request:
    paths:
      - 'lab03_inverse_kinematics/**'
      - '.github/workflows/miniarm-python.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-layout:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install numpy pyserial
      - name: Compile Python sources
        run: python -m compileall -q lab03_inverse_kinematics/python lab03_inverse_kinematics/miniarm_controlC
      - name: Core mathematics checks
        run: python -m unittest discover -s lab03_inverse_kinematics/python -v
      - name: Native Tk, layouts, calibration and motion checks
        run: python -m unittest discover -s lab03_inverse_kinematics/miniarm_controlC -p "test_*.py" -v
